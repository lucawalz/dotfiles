name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          path: ./
          extra_args: --only-verified
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make lint

  zizmor:
    uses: lucawalz/.github/.github/workflows/zizmor.yml@b4689c6655b628d5b755ad9a12ec7f247a72d392 # v0.2.0
    permissions:
      contents: read

  pr-title:
    if: github.event_name == 'pull_request'
    uses: lucawalz/.github/.github/workflows/pr-title.yml@b4689c6655b628d5b755ad9a12ec7f247a72d392 # v0.2.0
    permissions:
      contents: read
      pull-requests: read

  ci-gate:
    if: always()
    needs: [secret-scan, lint, zizmor, pr-title]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: pr-title

  notify:
    needs: [secret-scan, lint]
    if: failure() && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - run: |
          gh pr edit "$PR_URL" --add-assignee lucawalz
          gh pr comment "$PR_URL" --edit-last --create-if-none --body "Dependabot update failed CI - manual review required."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
