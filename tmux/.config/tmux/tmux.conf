set -g default-terminal tmux-256color
set -g allow-passthrough on
set -g focus-events on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'xterm*:RGB:usstyle'
set -g mouse on
set -g set-clipboard on
set -g set-titles on
set -g escape-time 10
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position bottom
setw -g mode-keys vi

source-file -F "#{d:current_file}/carbonfox.tmux"

bind '%' split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind x kill-pane
bind E select-layout -E
bind P display-popup -E -w 80% -h 70% -b rounded -s 'bg=default' -S 'fg=#78a9ff,bg=default' -d '#{pane_current_path}' '~/.config/tmux/scripts/pick.sh'
set -g detach-on-destroy off

bind -n C-h if -F "#{@pane-is-vim}" { send-keys C-h } { if -F '#{pane_at_left}' '' 'select-pane -L' }
bind -n C-j if -F "#{@pane-is-vim}" { send-keys C-j } { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind -n C-k if -F "#{@pane-is-vim}" { send-keys C-k } { if -F '#{pane_at_top}' '' 'select-pane -U' }
bind -n C-l if -F "#{@pane-is-vim}" { send-keys C-l } { if -F '#{pane_at_right}' '' 'select-pane -R' }
bind -n C-Up if -F "#{@pane-is-vim}" 'send-keys C-Up' 'resize-pane -U 2'
bind -n C-Down if -F "#{@pane-is-vim}" 'send-keys C-Down' 'resize-pane -D 2'
bind -n C-Left if -F "#{@pane-is-vim}" 'send-keys C-Left' 'resize-pane -L 2'
bind -n C-Right if -F "#{@pane-is-vim}" 'send-keys C-Right' 'resize-pane -R 2'
bind C-h send-keys C-h
bind C-j send-keys C-j
bind C-k send-keys C-k
bind C-l send-keys C-l

set-hook -g client-focus-in {
  run-shell 'd="${XDG_STATE_HOME:-$HOME/.local/state}/tmux"; mkdir -p "$d" && printf "%s\n" "#{hook_client}" >"$d/focused-client"; true'
}
set-hook -g client-focus-out {
  run-shell 'f="${XDG_STATE_HOME:-$HOME/.local/state}/tmux/focused-client"; [ "$(cat "$f" 2>/dev/null)" = "#{hook_client}" ] && rm -f "$f"; true'
}
